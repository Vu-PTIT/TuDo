[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "closet-loop-image-core"
version = "0.1.0"
description = "Closet Loop native image processing extension"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "closet_loop_image_core"
features = ["extension-module"]

